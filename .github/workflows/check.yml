name: Syntax check

on:
  push:
  pull_request:

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/agent.js
          node --check src/building.js
          node --check src/config.js
          node --check src/llm.js
          node --check src/memory.js
          node --check src/movement.js
          node --check src/physical-builder.js
          node --check src/reference-policy.js
          node --check src/rcon.js
          node --check src/world.js
          node --check scripts/dump-play-protocol.js
          node --check scripts/verify-26.2-registry.js
          node --check scripts/verify-26.2-blockpos.js
          node --check scripts/test-26.2-wire-tools.js
          node --check scripts/test-blueprints.js
          node --check scripts/test-protocol-dump.js
          node --check scripts/test-reference-policy.js
      - name: Run dependency-free regression tests
        run: |
          node scripts/test-protocol-dump.js
          node scripts/test-reference-policy.js
          node scripts/test-26.2-wire-tools.js
